      <text x="282" y="66" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Clarity &amp; Exposition</text>
      <text x="485" y="66" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">15%</text>

      <!-- Dimension 5 & 6 -->
