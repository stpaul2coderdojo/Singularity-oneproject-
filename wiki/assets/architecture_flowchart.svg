      <text x="12" y="110" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Reproducibility &amp; Open Science</text>
      <text x="215" y="110" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">10%</text>

      <rect x="270" y="88" width="255" height="36" rx="6" fill="#262626" />
      <text x="282" y="110" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Ethics &amp; Alignment Safety</text>
