    <text x="20" y="136" fill="#e5e5e5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">• Formal Mathematical Objective</text>
    <text x="20" y="158" fill="#f59e0b" font-family="monospace" font-size="11">min L(θ) s.t. convergence constraints</text>
  </g>

