    <text x="800" y="22" fill="#34d399" font-family="monospace" font-size="12">● PI: Bheemaiah (IIT Madras Alumni)</text>
    <text x="800" y="42" fill="#737373" font-family="monospace" font-size="11">Cloud Hosted: Google Cloud Run (Singapore)</text>
