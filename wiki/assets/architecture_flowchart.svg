    <rect x="16" y="16" width="28" height="28" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
    <text x="30" y="35" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">01</text>
