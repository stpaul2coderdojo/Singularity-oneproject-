    <text x="20" y="136" fill="#e5e5e5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">• Asymptotic Proofs &amp; Baselines</text>
    <text x="20" y="158" fill="#38bdf8" font-family="monospace" font-size="11">Theorem 1: Convergence rate O(1/√T)</text>
