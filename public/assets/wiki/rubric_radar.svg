<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="polyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3" />
    </linearGradient>
    <filter id="polyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="14" fill="#0d0d11" stroke="#262626" stroke-width="1.5" />

  <!-- Title -->
  <text x="300" y="38" fill="#ffffff" font-family="'Cinzel', serif, system-ui" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">
    ARXIV REVIEW RUBRIC DIMENSIONS (v2.4)
  </text>
  <text x="300" y="58" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
    Calibrated RLHF Vector Decomposition &amp; Weight Optimization
  </text>

  <!-- Radar Center (300, 230) Radius = 130 -->
  <!-- Web rings -->
  <g stroke="#33333e" stroke-width="1" fill="none" opacity="0.8">
    <!-- Level 1 (20%) -->
    <polygon points="300,204 322,217 322,243 300,256 278,243 278,217" />
    <!-- Level 2 (40%) -->
    <polygon points="300,178 345,204 345,256 300,282 255,256 255,204" />
    <!-- Level 3 (60%) -->
    <polygon points="300,152 367,191 367,269 300,308 233,269 233,191" />
    <!-- Level 4 (80%) -->
    <polygon points="300,126 390,178 390,282 300,334 210,282 210,178" />
    <!-- Level 5 (100%) Outer ring -->
    <polygon points="300,100 412,165 412,295 300,360 188,295 188,165" stroke="#52525b" stroke-width="1.5" />
  </g>

  <!-- Spoke axes from center (300, 230) -->
  <g stroke="#40404a" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="300" y1="230" x2="300" y2="100" />
    <line x1="300" y1="230" x2="412" y2="165" />
    <line x1="300" y1="230" x2="412" y2="295" />
    <line x1="300" y1="230" x2="300" y2="360" />
    <line x1="300" y1="230" x2="188" y2="295" />
    <line x1="300" y1="230" x2="188" y2="165" />
  </g>

  <!-- Filled Data Polygon (Novelty: 95%, Rigor: 92%, Significance: 88%, Clarity: 90%, Repro: 85%, Ethics: 96%) -->
  <polygon points="300,106 403,170 398,287 300,347 205,285 199,171"
           fill="url(#polyGrad)" stroke="#f59e0b" stroke-width="2.2" filter="url(#polyGlow)" />

  <!-- Data vertices circles -->
  <circle cx="300" cy="106" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1" />
  <circle cx="403" cy="170" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1" />
  <circle cx="398" cy="287" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1" />
  <circle cx="300" cy="347" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1" />
  <circle cx="205" cy="285" r="4.5" fill="#c084fc" stroke="#ffffff" stroke-width="1" />
  <circle cx="199" cy="171" r="4.5" fill="#c084fc" stroke="#ffffff" stroke-width="1" />

  <!-- Labels -->
  <!-- Top: Novelty (25%) -->
  <text x="300" y="85" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    Novelty &amp; Originality (25%)
  </text>

  <!-- Top-Right: Rigor (25%) -->
  <text x="424" y="160" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">
    Technical Rigor (25%)
  </text>
  <text x="424" y="174" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="10">
    Proof Verification &amp; Bounds
  </text>

  <!-- Bottom-Right: Empirical Significance (20%) -->
  <text x="424" y="300" fill="#e5e5e5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">
    Empirical Significance (20%)
  </text>
  <text x="424" y="314" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="10">
    Pareto Frontiers &amp; Baselines
  </text>

  <!-- Bottom: Clarity & Exposition (15%) -->
  <text x="300" y="385" fill="#e5e5e5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    Clarity &amp; Exposition (15%)
  </text>
  <text x="300" y="399" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">
    IMRaD Structure &amp; KaTeX Typography
  </text>

  <!-- Bottom-Left: Reproducibility (10%) -->
  <text x="176" y="300" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">
    Reproducibility (10%)
  </text>
  <text x="176" y="314" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">
    Pseudocode &amp; Open Data
  </text>

  <!-- Top-Left: Ethics & Governance (5%) -->
  <text x="176" y="160" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">
    Ethics &amp; Governance (5%)
  </text>
  <text x="176" y="174" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">
    Dual-use &amp; Safety Verification
  </text>

  <!-- Bottom Footer -->
  <text x="300" y="432" fill="#737373" font-family="monospace" font-size="10" text-anchor="middle">
    Singularity-1 Platform • Evaluated under Bheemaiah (IIT Madras Alumni) Research Framework
  </text>
</svg>
